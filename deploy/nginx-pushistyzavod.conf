server {
    server_name pushistyzavod.ru www.pushistyzavod.ru;

    root /var/www/pushistyzavod/prototype;
    index index.html;

    # canonical host: www → не-www
    if ($host = www.pushistyzavod.ru) {
        return 301 https://pushistyzavod.ru$request_uri;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API (формы заявок) — Node
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Служебные SEO-файлы — Node (актуальные версии генерирует генератор)
    location = /robots.txt { proxy_pass http://127.0.0.1:3000; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:3000; }
    location = /sitemap-feeds.xml { proxy_pass http://127.0.0.1:3000; }
    location = /favicon.ico { proxy_pass http://127.0.0.1:3000; }
    location = /404.html { proxy_pass http://127.0.0.1:3000; }

    # Ассеты прототипа (css/js/картинки/шрифты) — напрямую, кэш 30 дней
    location ~* ^/prototype/.+\.(?:css|js|png|jpe?g|webp|gif|svg|ico|woff2?|ttf|mp4|webm|pdf)$ {
        root /var/www/pushistyzavod;
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(?:css|js|png|jpe?g|webp|gif|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Всё остальное — Node/Express:
    # чистые URL посадочных (/mascots/), core-страницы (/.html),
    # 301-редиректы со старых URL Тильды, брендированная 404
    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pushistyzavod.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pushistyzavod.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.pushistyzavod.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = pushistyzavod.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pushistyzavod.ru www.pushistyzavod.ru;
    return 404; # managed by Certbot
}
