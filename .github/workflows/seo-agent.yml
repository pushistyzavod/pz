name: SEO agent

# Раз в неделю разведчик проверяет, на каком месте нас советуют нейросети,
# а SEO-агент готовит статью для блога: выбирает тему, ищет факты
# в интернете (Gemini + поиск Google), пишет и проверяет текст и присылает
# черновик владельцу в Telegram. Публикация — когда владелец ответит на
# сообщение фотографией для обложки (это обрабатывает news-bot.yml).
# Настройки (ключ Gemini, токен бота, ID владельца) — в /opt/pz-bot/.env на сервере.

on:
  schedule:
    # понедельник, 07:17 по Москве
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Load bot settings from server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'cat /opt/pz-bot/.env' > "$RUNNER_TEMP/bot.env"
          rm -f ~/.ssh/deploy_key
          while IFS='=' read -r key value; do
            case "$key" in ''|\#*) continue ;; esac
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/bot.env"
          rm -f "$RUNNER_TEMP/bot.env"

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image library
        run: npm install --prefix bot --no-save --no-package-lock --no-audit --no-fund jimp@0.22.12

      # Разведчик: на каком месте нас называют нейросети — слабые вопросы агент берёт в темы
      - name: Check AI visibility
        continue-on-error: true
        run: node bot/visibility.js

      - name: Write draft
        run: node bot/agent.js

      - name: Save draft to repository
        run: |
          git config user.name "pushistyzavod-bot"
          git config user.email "bot@pushistyzavod.ru"
          git add bot/drafts bot/visibility.json
          git commit -m "SEO-агент: черновик статьи недели"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Send draft to owner
        run: node bot/agent.js notify

      - name: Send AI visibility report
        continue-on-error: true
        run: node bot/visibility.js notify
