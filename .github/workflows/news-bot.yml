name: News bot

# Telegram-бот @pushistyzavodBot: фото + подпись → новость на сайте.
# Сервер сайта стоит в России, оттуда Telegram недоступен, поэтому бот
# работает здесь: по расписанию забирает сообщения, пишет текст через Gemini,
# сохраняет новость в репозиторий и запускает деплой.
# Настройки (токен бота, ключ Gemini, разрешённые ID) лежат не в git,
# а на сервере в /opt/pz-bot/.env и читаются оттуда при каждом запуске.

on:
  schedule:
    # Каждые 5 минут со сдвигом: в «круглые» минуты очередь GitHub перегружена
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
      urls: ${{ steps.poll.outputs.urls }}
    steps:
      - name: Load bot settings from server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'cat /opt/pz-bot/.env' > "$RUNNER_TEMP/bot.env"
          rm -f ~/.ssh/deploy_key
          # Каждое значение скрываем в логах и передаём следующим шагам
          while IFS='=' read -r key value; do
            case "$key" in ''|\#*) continue ;; esac
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/bot.env"
          rm -f "$RUNNER_TEMP/bot.env"

      # Быстрая проверка: если новых сообщений нет, остальные шаги не выполняются
      - name: Check for new messages
        id: check
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "В /opt/pz-bot/.env на сервере нет TELEGRAM_BOT_TOKEN — бот выключен"
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # сообщения и нажатия кнопок под черновиками SEO-агента
          count=$(curl -s -m 20 -G "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" --data-urlencode 'limit=1' --data-urlencode 'timeout=0' --data-urlencode 'allowed_updates=["message","callback_query"]' | jq '.result | length')
          echo "Новых сообщений: ${count:-0}"
          if [ "${count:-0}" -gt 0 ]; then echo "pending=true" >> "$GITHUB_OUTPUT"; else echo "pending=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout repository
        if: steps.check.outputs.pending == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        if: steps.check.outputs.pending == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Process messages
        id: poll
        if: steps.check.outputs.pending == 'true'
        run: node bot/poll.js

      - name: Save changes to repository
        if: steps.poll.outputs.changed == 'true' || steps.poll.outputs.drafts == 'true'
        run: |
          git config user.name "pushistyzavod-bot"
          git config user.email "bot@pushistyzavod.ru"
          git add generator/data/news-posts.json prototype/news prototype/news.html prototype/sitemap.xml prototype/images/news bot/drafts
          git commit -m "Новости: обновление через Telegram-бота" || true
          git pull --rebase origin main
          git push origin HEAD:main

      # Ответы и подтверждение сообщений — только после того, как изменения сохранены
      - name: Reply in Telegram
        if: steps.check.outputs.pending == 'true'
        run: node bot/ack.js

      # «Другую тему» или /agent — SEO-агент сразу готовит новый черновик и присылает владельцу
      - name: SEO agent — new draft
        if: steps.poll.outputs.agent == 'true'
        run: |
          node bot/agent.js
          git add bot/drafts
          git commit -m "SEO-агент: новый черновик статьи"
          git pull --rebase origin main
          git push origin HEAD:main
          node bot/agent.js notify

  deploy:
    needs: bot
    if: needs.bot.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # Сообщаем Яндексу и Bing о новых страницах (IndexNow), чтобы их быстрее проиндексировали
  indexnow:
    needs: [bot, deploy]
    if: needs.bot.outputs.urls != ''
    runs-on: ubuntu-latest
    steps:
      - name: Ping search engines
        env:
          URLS: ${{ needs.bot.outputs.urls }}
          KEY: 115ea3389c92ea8a429ccfa13bb6b845
        run: |
          for url in $URLS https://pushistyzavod.ru/news/; do
            for engine in yandex.com www.bing.com; do
              code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' -G "https://${engine}/indexnow" --data-urlencode "url=${url}" --data-urlencode "key=${KEY}" || true)
              echo "${engine} ${url} -> ${code}"
            done
          done
